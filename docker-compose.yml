services:
  kg-fabric-postgres:
    image: pgvector/pgvector:pg16
    container_name: kg-fabric-postgres
    environment:
      POSTGRES_USER: ${KG_FABRIC_PG_USER:-kg_admin}
      POSTGRES_PASSWORD: ${KG_FABRIC_PG_PASS:-local_dev_only}
      POSTGRES_DB: enterprise_kg_fabric
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kg_admin -d enterprise_kg_fabric"]
      interval: 5s
      timeout: 5s
      retries: 10

  kg-fabric-neo4j:
    image: neo4j:5-community
    container_name: kg-fabric-neo4j
    environment:
      NEO4J_AUTH: ${KG_FABRIC_NEO4J_AUTH:-neo4j/local_dev_only}
      NEO4J_PLUGINS: '[]'
    ports:
      - "7475:7474"
      - "7688:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

  # Optional full self-hosted FastAPI + MCP service container.
  # Start entire cloned stack with: docker compose --profile app up -d --build
  kg-fabric-api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kg-fabric-api
    depends_on:
      kg-fabric-postgres:
        condition: service_healthy
      kg-fabric-neo4j:
        condition: service_healthy
    environment:
      PGHOST: kg-fabric-postgres
      PGPORT: "5432"
      PGDATABASE: enterprise_kg_fabric
      PGUSER: ${KG_FABRIC_PG_USER:-kg_admin}
      PGPASSWORD: ${KG_FABRIC_PG_PASS:-local_dev_only}
      GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://kg-fabric-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${KG_FABRIC_NEO4J_PASS:-local_dev_only}
      KG_FABRIC_AUTH_MODE: ${KG_FABRIC_AUTH_MODE:-api_key}
      KG_FABRIC_API_KEYS: ${KG_FABRIC_API_KEYS:-local_dev_api_key_change_me}
      KG_FABRIC_ALLOW_UNAUTHENTICATED: ${KG_FABRIC_ALLOW_UNAUTHENTICATED:-false}
      KG_FABRIC_DOMAIN_PACK: ${KG_FABRIC_DOMAIN_PACK:-cloud_sre}
      KG_FABRIC_USE_LIVE_LLM: ${KG_FABRIC_USE_LIVE_LLM:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"
