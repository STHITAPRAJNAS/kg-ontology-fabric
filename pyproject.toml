[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-kg-ontology-fabric"
version = "0.2.0"
description = "Enterprise Automated Ontology & Knowledge Graph Service from 100s of Heterogeneous pgvector KBs and Raw Documents using LlamaIndex, Neo4j/Neptune, PostgreSQL/pgvector, HippoRAG PPR, Leiden Global Search, Presidio PII & MCP"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Sthitaprajna Sahoo", email = "papu.sahoo@gmail.com" }]
requires-python = ">=3.11"
keywords = [
    "knowledge-graph",
    "ontology",
    "graphrag",
    "llamaindex",
    "pgvector",
    "postgresql",
    "neo4j",
    "amazon-neptune",
    "opencypher",
    "presidio",
    "shacl",
    "owl",
]
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "asyncpg>=0.29.0",
    "neo4j>=5.20.0",
    "rdflib>=7.0.0",
    "pyshacl>=0.26.0",
]

[project.urls]
Homepage = "https://github.com/STHITAPRAJNAS/kg-ontology-fabric"
Repository = "https://github.com/STHITAPRAJNAS/kg-ontology-fabric"
Documentation = "https://github.com/STHITAPRAJNAS/kg-ontology-fabric/blob/main/docs/architecture_and_explainer_guide.md"
Issues = "https://github.com/STHITAPRAJNAS/kg-ontology-fabric/issues"

[project.optional-dependencies]
pii = [
    "presidio-analyzer>=2.2.354",
    "presidio-anonymizer>=2.2.354",
    "spacy>=3.7.0",
]
llamaindex = [
    "llama-index-core>=0.11.0",
    "llama-index-vector-stores-postgres>=0.2.0",
    "llama-index-graph-stores-neo4j>=0.3.0",
    "llama-index-graph-stores-neptune>=0.2.0",
]
llm = [
    "google-genai>=1.0.0",
    "openai>=1.40.0",
]
graph-analytics = [
    "networkx>=3.3",
    "leidenalg>=0.10.2",
    "python-igraph>=0.11.5",
]
multimodal = [
    "docling>=2.5.0",
    "llama-parse>=0.5.0",
]
rerank = [
    "sentence-transformers>=3.0.0",
]
eval = [
    "ragas>=0.2.0",
]
mcp = [
    "mcp>=1.2.0",
]
otel = [
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
]
aws = [
    "boto3>=1.34.0",
]
all = [
    "presidio-analyzer>=2.2.354",
    "presidio-anonymizer>=2.2.354",
    "spacy>=3.7.0",
    "llama-index-core>=0.11.0",
    "llama-index-vector-stores-postgres>=0.2.0",
    "llama-index-graph-stores-neo4j>=0.3.0",
    "llama-index-graph-stores-neptune>=0.2.0",
    "google-genai>=1.0.0",
    "networkx>=3.3",
    "mcp>=1.2.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "boto3>=1.34.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_kg_fabric"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::UserWarning",
]
